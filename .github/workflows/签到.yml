name: 签到

on:
  workflow_dispatch: # 允许手动触发
  schedule:
    - cron: '0 8 * * *' # 每天北京时间 16:00 运行一次 (你可以根据需要修改时间)

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 创建 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm ci

      - name: 执行签到并发送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: node scheduler.js once
